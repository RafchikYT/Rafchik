<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Панель управления Rafchik</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg1: #0e1630; --bg2: #1c2a54;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.12);
    --text: #f2f5ff; --muted: #9aa7cc;
    --gold: #ffba21; --gold-dark: #1e190a;
    --green: #23b25a; --red: #d84a4a; --blue: #3b7ddd;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 16px 16px 32px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 18px 0 8px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 10px; border: 1px solid var(--border); border-radius: 14px;
    background: var(--card); color: var(--text);
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform 0.06s;
  }
  .btn:active { transform: scale(0.97); }
  .btn.green { background: var(--green); border-color: transparent; color: #fff; }
  .btn.red { background: var(--red); border-color: transparent; color: #fff; }
  .btn.gold { background: var(--gold); border-color: transparent; color: var(--gold-dark); }
  .btn.wide { grid-column: 1 / -1; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  input, select, textarea {
    flex: 1; width: 100%;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font-size: 14px; padding: 12px;
    outline: none; appearance: none;
  }
  textarea { resize: none; min-height: 72px; font-family: inherit; }
  select option { background: var(--bg1); color: var(--text); }
  .send {
    flex: 0 0 auto; padding: 12px 18px; border: none; border-radius: 12px;
    background: var(--blue); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: #fff; font-size: 13px;
    padding: 10px 16px; border-radius: 999px; opacity: 0; transition: opacity 0.2s;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎛 Панель Rafchik</h1>
  <p class="sub">Команда уходит боту — ответ придёт сообщением в чат.</p>

  <h2>Обзор</h2>
  <div class="grid">
    <button class="btn" onclick="cmd('stats')">📊 Статистика</button>
    <button class="btn" onclick="cmd('leads')">📋 Все лиды</button>
    <button class="btn" onclick="cmd('leads', 'new')">🆕 Новые</button>
    <button class="btn" onclick="cmd('leads', 'replied')">💬 Ответившие</button>
    <button class="btn" onclick="cmd('leads', 'interested')">🔥 Заинтересованные</button>
    <button class="btn" onclick="cmd('message')">✉️ Шаблон</button>
  </div>

  <h2>Автоотправка</h2>
  <div class="grid">
    <button class="btn green" onclick="cmd('auto', 'on')">▶️ Включить</button>
    <button class="btn red" onclick="cmd('auto', 'off')">⏸ Выключить</button>
  </div>

  <h2>Поиск бизнесов</h2>
  <div class="row">
    <select id="cat">
      <option value="cafe">Кафе</option>
      <option value="restaurant">Рестораны</option>
      <option value="bar">Бары</option>
      <option value="fastfood">Фастфуд</option>
      <option value="bakery">Пекарни</option>
      <option value="hairdresser">Парикмахерские</option>
      <option value="beauty">Салоны красоты</option>
      <option value="spa">СПА</option>
      <option value="dentist">Стоматологии</option>
      <option value="clinic">Клиники</option>
      <option value="gym">Фитнес-залы</option>
      <option value="hotel">Отели</option>
      <option value="autoservice">Автосервисы</option>
      <option value="carwash">Автомойки</option>
      <option value="pharmacy">Аптеки</option>
      <option value="clothes">Магазины одежды</option>
    </select>
    <button class="send" onclick="cmd('search', document.getElementById('cat').value)">🔎 Искать</button>
  </div>

  <h2>Отправить лиду</h2>
  <div class="row">
    <input id="leadId" type="number" inputmode="numeric" placeholder="Номер лида, напр. 3">
    <button class="send" onclick="sendLead()">📤 Отправить</button>
  </div>
  <p class="hint">Отправит сообщение с фото этому лиду в WhatsApp.</p>

  <h2>Задача для Claude</h2>
  <textarea id="task" placeholder="Опиши задачу — Claude выполнит на компьютере и отчитается сюда"></textarea>
  <div class="row" style="margin-top:10px">
    <button class="btn gold wide" onclick="sendTask()">📝 Передать Claude</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  function toast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function push(payload) {
    if (!tg || !tg.sendData) { toast('Откройте панель через кнопку «🎛 Панель» в боте'); return; }
    tg.sendData(JSON.stringify(payload)); // Telegram закроет мини-апп после отправки
  }

  function cmd(c, arg) { push({ cmd: c, arg: arg || '' }); }

  function sendLead() {
    const id = document.getElementById('leadId').value.trim();
    if (!id) { toast('Укажите номер лида'); return; }
    push({ cmd: 'send', arg: id });
  }

  function sendTask() {
    const text = document.getElementById('task').value.trim();
    if (!text) { toast('Опишите задачу'); return; }
    push({ cmd: 'task', arg: text });
  }
</script>
</body>
</html>
